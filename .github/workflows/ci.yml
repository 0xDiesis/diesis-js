name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    # Official Solidity linux-amd64 distribution; no unqualified arm compiler.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: 0xDiesis
          repositories: diesis-contracts
      - name: Checkout exact contracts source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: 0xDiesis/diesis-contracts
          ref: e905d65c6a52df39f1d73906e9f5e91bd69011e9
          path: contracts-checkout
          submodules: false
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Install SDK dependencies without compiler or generator scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      # No artifact/dependency cache: every run builds once from exact inputs.
      # No Permit2, submodules, circuits, contracts pnpm generation or forge-ds.
      - name: Qualify one source-only artifact build
        run: |
          python3 scripts/qualify-contract-inputs.py --contracts "$GITHUB_WORKSPACE/contracts-checkout" --work "$RUNNER_TEMP/diesis-sdk-qualified-inputs" --environment-output "$RUNNER_TEMP/diesis-sdk-inputs.env"
          cat "$RUNNER_TEMP/diesis-sdk-inputs.env" >> "$GITHUB_ENV"
      - name: ABI drift, lint, typecheck and formatting
        run: pnpm run quality
      - name: Build published JavaScript and declarations
        run: pnpm run build
      - name: Built package consumer compatibility
        run: pnpm run test:consumer
      - name: Helper regressions
        run: |
          pnpm run test:codegen
          python3 -m unittest discover -s test -p 'test_*capture.py' -v
          python3 -m unittest discover -s test -p 'test_codegen_qualifier.py' -v
      - name: Test
        env:
          # Read committed test-circuit fixtures only; do not compile circuits.
          DIESIS_CONTRACTS_DIR: ${{ github.workspace }}/contracts-checkout
        run: pnpm run test
